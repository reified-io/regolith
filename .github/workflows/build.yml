name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # only a pull request may drop an older run: on main every commit gets its own group, so a burst
  # of merges neither cancels the run in progress nor discards the ones waiting behind it — a pending
  # run is dropped when the next one queues, which would leave commits verified by nothing.
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      # the docker and host tests stay off without their environment variables, so this touches
      # neither the runner's daemon nor its firewall.
      - run: ./gradlew build detekt

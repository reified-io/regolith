name: libraries

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # the central token and the signing key live in this environment, which admits release tags and
    # no branch, so nothing running on a branch can read either.
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # images take their tags from the git tag while jars take their version from the build, so a
      # release whose tag says something else would publish coordinates no one can ever take back.
      - name: check the tag against the build's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$version" != "$TAG" ]; then
            echo "gradle.properties says $version, the release tag says $TAG" >&2
            exit 1
          fi

      - name: build and sign the bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToBundleRepository

      # the upload only validates and stages: maven central never lets a published version be
      # replaced or removed, so releasing the deployment stays a person's click in the portal.
      - name: upload the bundle to the central portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # central builds its own metadata, and its bundle rules say nothing about carrying ours.
          (cd build/bundle && zip -qr "$RUNNER_TEMP/bundle.zip" . -x '*maven-metadata.xml*')
          auth="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $auth" \
            -F "bundle=@$RUNNER_TEMP/bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=regolith-$TAG&publishingType=USER_MANAGED"
